# Site configuration. The build reads this file and the pages in content/.
name: Example site
lang: en
# Links in the header. A link is current on its own page. A folder link
# ("/elements/") is also current on each page in that folder.
nav:
  - { href: /elements/, label: Elements }
  - { href: /search.html, label: Search }
# HTML at the bottom of each page. Remove it for no footer.
footer: Placeholder content. Replace site.yaml and the files in content/.
